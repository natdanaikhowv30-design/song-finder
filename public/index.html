<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="ระบบค้นหาเพลงจากชื่อเพลง ศิลปิน และแนวเพลง">
  <title>Song Finder</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎵</text></svg>">
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main class="wrap">
    <h1>🎵 Song Finder</h1>
    <p class="sub">ค้นหาเพลงจากชื่อเพลง ศิลปิน หรือแนวเพลง</p>

    <label class="sr-only" for="q">ช่องค้นหาเพลง</label>
    <input id="q" type="search" placeholder="พิมพ์เพื่อค้นหา..."
           autocomplete="off" spellcheck="false" disabled
           aria-describedby="count">

    <div id="count" class="count" role="status" aria-live="polite"></div>
    <ul id="results" class="results" aria-live="polite"></ul>

    <noscript>
      <p class="empty">แอปพลิเคชันนี้จำเป็นต้องเปิดใช้งาน JavaScript</p>
    </noscript>
  </main>
</body>
</html>
