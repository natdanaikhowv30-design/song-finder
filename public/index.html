<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="ค้นหาและฟังเพลงจากชาร์ต Apple Music พร้อมเล่นต่อเนื่องอัตโนมัติ">
  <title>Song Finder</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎵</text></svg>">
  <link rel="preconnect" href="https://audio-ssl.itunes.apple.com" crossorigin>
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <main class="wrap">
    <header>
      <h1>🎵 Song Finder</h1>
      <p class="sub">ชาร์ต Apple Music · ฟังตัวอย่าง 30 วินาที · เล่นต่อเนื่องอัตโนมัติ</p>
    </header>

    <label class="sr-only" for="q">ช่องค้นหาเพลง</label>
    <input id="q" type="search" placeholder="พิมพ์ชื่อเพลง ศิลปิน หรือแนวเพลง..."
           autocomplete="off" spellcheck="false" disabled aria-describedby="count">

    <div id="hint" class="hint" role="status" aria-live="polite"></div>

    <div class="toolbar">
      <button type="button" class="tb" id="playAll">▶ เล่นทั้งหมด</button>
      <button type="button" class="tb" id="shuffleAll">🔀 สุ่มเล่น</button>
      <button type="button" class="tb" id="reload" title="ดึงชาร์ตล่าสุด">⟳ รีเฟรช</button>
      <span id="src" class="src"></span>
    </div>

    <div id="chips" class="chips" role="group" aria-label="กรองตามแนวเพลง"></div>
    <div id="count" class="count" role="status" aria-live="polite"></div>
    <ul id="results" class="results"></ul>

    <footer class="foot">
      ข้อมูลชาร์ตและตัวอย่างเสียง 30 วินาที ให้บริการโดย Apple Marketing Tools RSS Feed
      และ iTunes Search API เพื่อวัตถุประสงค์ในการค้นหาและรับฟังตัวอย่างเท่านั้น
    </footer>

    <noscript><p class="empty">แอปพลิเคชันนี้จำเป็นต้องเปิดใช้งาน JavaScript</p></noscript>
  </main>

  <!-- Now Playing Bar -->
  <div id="nowbar" class="nowbar" hidden role="region" aria-label="เครื่องเล่นเพลง">
    <div class="nb-seek">
      <input id="nbRange" type="range" min="0" max="1000" value="0" step="1"
             aria-label="ตำแหน่งการเล่น">
    </div>
    <div class="nb-body">
      <img id="nbArt" class="nb-art" alt="" width="44" height="44">
      <div class="nb-info">
        <div id="nbTitle" class="nb-title">—</div>
        <div id="nbMeta" class="nb-meta"></div>
      </div>
      <div class="nb-ctrl">
        <button type="button" class="nb-btn" id="nbShuffle" aria-pressed="false" aria-label="สุ่มลำดับ">🔀</button>
        <button type="button" class="nb-btn" id="nbPrev" aria-label="เพลงก่อนหน้า">⏮</button>
        <button type="button" class="nb-btn primary" id="nbPlay" aria-label="เล่นหรือหยุด">❚❚</button>
        <button type="button" class="nb-btn" id="nbNext" aria-label="เพลงถัดไป">⏭</button>
        <button type="button" class="nb-btn" id="nbRepeat" data-mode="off" aria-label="โหมดเล่นซ้ำ">🔁</button>
      </div>
      <div class="nb-time"><span id="nbPos">0:00</span> / <span id="nbDur">0:30</span></div>
      <button type="button" class="nb-btn close" id="nbClose" aria-label="ปิดเครื่องเล่น">✕</button>
    </div>
  </div>

  <audio id="player" preload="none"></audio>
</body>
</html>
